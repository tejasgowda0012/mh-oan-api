services:
  app:
    container_name: sva_app
    build: .
    ports:
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - svanetwork

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - svanetwork

networks:
  svanetwork:
    external: true

volumes:
  qdrant_storage: