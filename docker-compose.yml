services:
  redis:
    image: redis:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - svanetwork

  app:
    container_name: sva_app
    build: .
    ports:
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - svanetwork

networks:
  svanetwork:
    external: true