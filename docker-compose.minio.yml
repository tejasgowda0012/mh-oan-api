services:
  minio:
    image: minio/minio:latest
    container_name: sva_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${MINIO_DATA_DIR:-./minio-data}:/data
    restart: unless-stopped
    networks:
      - svanetwork

  minio-lifecycle:
    image: minio/mc:latest
    container_name: sva_minio_lifecycle
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_PEST_UPLOAD_BUCKET:-pest-detection-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        until mc alias set local http://minio:9000 \
          "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done

        mc mb --ignore-existing "local/$${MINIO_BUCKET}"

        printf '%s\n' '{"Rules":[{"ID":"expire-after-seven-days","Status":"Enabled","Expiration":{"Days":7}}]}' \
          | mc ilm rule import "local/$${MINIO_BUCKET}"
    restart: "no"
    networks:
      - svanetwork

networks:
  svanetwork:
    external: true
